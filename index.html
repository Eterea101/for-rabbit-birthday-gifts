<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日快乐 🐰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fdf0f3;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #app { width: 100%; height: 100%; }
    #camera-feed {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      top: -1px;
      left: -1px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-msg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:serif;color:#5C3D4A;pointer-events:none">
    <div style="font-size:48px;margin-bottom:16px">🐰</div>
    <div style="font-size:20px" id="boot-text">少女心满载中…</div>
  </div>
  <video id="camera-feed" autoplay playsinline muted></video>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
